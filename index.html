<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Richard Ritter</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f4;
      color: #1a1a1a;
    }
    .card {
      background: #fff;
      padding: 2.5rem 2rem;
      margin: 1rem;
      max-width: 24rem;
      width: 100%;
      border: 1px solid #ddd;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .25rem; }
    .firma { margin: 0 0 1.5rem; color: #555; }
    address { font-style: normal; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eee; }
      .card { background: #1e1e1e; border-color: #333; }
      .firma { color: #aaa; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Richard Ritter</h1>
    <p class="firma">Ritter – Blumen und Pflanzen</p>
    <address>
      Hauptstraße 67<br>
      86757 Wallerstein
    </address>
  </main>
</body>
</html>
